[project]
name = "girafmcp"
version = "0.1.0"
description = "MCP server for GIRAF project knowledge assistance"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=2.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0",
]

[project.scripts]
giraf-mcp = "girafmcp.server:main"

[project.optional-dependencies]
http = [
    "uvicorn>=0.27.0",
    "starlette>=0.30.0",
    "sse-starlette>=1.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "fpdf2>=2.7.0",  # For creating test PDFs
    "types-PyYAML>=6.0.0",  # For type checking
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "integration: hits the live GitHub API; run with `pytest -m integration`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
